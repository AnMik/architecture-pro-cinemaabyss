apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: movies-service-canary
  namespace: cinemaabyss
spec:
  host: movies-service
  subsets:
  - name: v1
    labels:
      version: v1
    trafficPolicy:
      connectionPool:
        tcp: 
          maxConnections: 100
  - name: v2
    labels:
      version: v2
    trafficPolicy:
      connectionPool:
        tcp: 
          maxConnections: 50
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: movies-service-canary
  namespace: cinemaabyss
spec:
  hosts:
  - movies-service
  http:
  - route:
    - destination:
        host: movies-service
        subset: v1
      weight: 90
    - destination:
        host: movies-service
        subset: v2
      weight: 10